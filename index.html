/* ===== BASE STYLES ===== */
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-tap-highlight-color:transparent;overflow-x:hidden;transition:background .3s,color .3s;font-size:16px;line-height:1.5;}
.app{max-width:480px;margin:0 auto;padding-bottom:85px;position:relative;z-index:1;font-size:15px;}
button{-webkit-appearance:none;outline:none;font-family:var(--font);font-size:13px;}
::-webkit-scrollbar{width:0;}
input,textarea{font-family:var(--font);font-size:15px;}

.card{background:var(--card-bg);border:var(--card-border);border-radius:var(--card-r);padding:18px;position:relative;overflow:hidden;transition:all .2s;}
.card-sm{background:var(--card-bg);border:var(--card-border);border-radius:var(--card-r);padding:14px;position:relative;overflow:hidden;}
.btn{border:1px solid var(--a1);border-radius:var(--btn-r);padding:11px 20px;font-weight:600;cursor:pointer;background:transparent;color:var(--a1);font-size:12px;letter-spacing:1px;text-transform:uppercase;transition:all .15s;font-family:var(--font);}
.btn:active{transform:scale(0.96);}
.btn-fill{background:var(--a1);color:#fff;border-color:var(--a1);box-shadow:var(--glow1);}
.btn-a2{border-color:var(--a2);color:var(--a2);}
.btn-a2.btn-fill{background:var(--a2);box-shadow:var(--glow2);}
.btn-a3{border-color:var(--a3);color:var(--a3);}
.tag{display:inline-block;border:1px solid;border-radius:var(--btn-r);padding:3px 10px;font-size:10px;font-weight:600;letter-spacing:0.5px;}
.chk{width:28px;height:28px;border:2px solid var(--border);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:14px;cursor:pointer;transition:all .2s;}
.chk.done{background:var(--a1);border-color:var(--a1);color:#fff;box-shadow:var(--glow1);}
.hd{font-family:var(--font2);}
.xp-bar{height:8px;background:rgba(128,128,128,0.15);border-radius:99px;overflow:hidden;border:1px solid var(--border);}
.xp-bar div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--a1),var(--a2));transition:width .3s;}
.muscle-tag{display:inline-block;border:1px solid;border-radius:99px;padding:2px 8px;font-size:10px;font-weight:600;letter-spacing:0.3px;margin:2px 2px 2px 0;opacity:.8;}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--nav-bg);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 0 18px;z-index:100;}
.nav-btn{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--text2);font-weight:600;padding:5px 8px;letter-spacing:0.5px;text-transform:uppercase;transition:all .2s;}
.nav-btn.active{color:var(--a1);}
.nav-btn span{font-size:20px;}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--bg2);border:1px solid var(--a1);border-radius:var(--card-r);padding:24px;width:100%;max-width:360px;max-height:85vh;overflow-y:auto;box-shadow:var(--glow1),0 20px 60px rgba(0,0,0,0.4);}
@keyframes confettiFall{0%{transform:translateY(-10px) rotate(0);opacity:1;}100%{transform:translateY(100vh) rotate(720deg);opacity:0;}}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
@keyframes timerPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,105,180,0.4);}50%{box-shadow:0 0 0 15px rgba(255,105,180,0);}}
.fade-in{animation:fadeIn .3s ease forwards;}
.confetti-piece{position:absolute;top:-10px;animation:confettiFall 2s ease-in forwards;}
.timer-display{width:140px;height:140px;border:2px solid var(--a1);border-radius:50%;display:flex;align-items:center;justify-content:center;margin:16px auto;position:relative;background:var(--card-bg);}
.timer-display.running{animation:timerPulse 2s ease infinite;}
.mood-btn{flex:1;padding:14px 8px;border:1px solid var(--border);border-radius:var(--card-r);background:var(--card-bg);cursor:pointer;text-align:center;transition:all .2s;font-size:14px;}
.session-timer{display:flex;align-items:center;gap:10px;padding:10px 16px;border:1px solid var(--a3);border-radius:var(--card-r);margin-bottom:10px;background:rgba(255,217,61,0.05);}
.session-timer .st-time{font-family:var(--font2);font-size:14px;color:var(--a3);min-width:60px;}
.session-timer .st-bar{flex:1;height:6px;background:rgba(128,128,128,0.15);border-radius:99px;overflow:hidden;}
.session-timer .st-bar div{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--a3),var(--a1));transition:width 1s linear;}
.mood-btn:active{background:var(--a1);border-color:var(--a1);}
</style>
</head>

function today(){return new Date().toISOString().split('T')[0];}
function getLevel(){for(var i=levels.length-1;i>=0;i--)if(S.xp>=levels[i].minXP)return levels[i];return levels[0];}
function getNextLevel(){var c=getLevel();for(var i=0;i<levels.length;i++)if(levels[i].minXP>c.minXP)return levels[i];return null;}
function getLevelProg(){var c=getLevel(),n=getNextLevel();if(!n)return 100;return Math.round(((S.xp-c.minXP)/(n.minXP-c.minXP))*100);}
function getExLimit(){return(S.sessionLength||60)>=90?999:4;}
function getDayProg(i){var exs=workoutPlan[i].exercises,limit=Math.min(exs.length,getExLimit()),d=0;for(var j=0;j<limit;j++){if(S.ex[i+'-'+j])d++;}return{done:d,total:limit,pct:Math.round((d/limit)*100)};}
function getDayMacros(di){var mp=mealPlan[di],c=0,p=0,cb=0,f=0;mp.meals.forEach(function(m){c+=m.cal;p+=m.protein;cb+=m.carbs;f+=m.fat;});return{cal:c,p:p,c:cb,f:f};}
function getDayMealsChecked(di){var mp=mealPlan[di],d=0;mp.meals.forEach(function(_,i){if(S.cmeals[di+'-'+i])d++;});return{done:d,total:mp.meals.length};}

function completeDay(di){if(S.wk[di])return;S.wk[di]=true;S.total++;S.xp+=25;var t=today(),last=S.history.length?S.history[S.history.length-1].date:null;var yd=new Date();yd.setDate(yd.getDate()-1);var yds=yd.toISOString().split('T')[0];if(last===yds||last===t)S.streak++;else if(last!==t)S.streak=1;if(S.streak>S.bstreak)S.bstreak=S.streak;S.history.push({date:t,day:di});badgesDef.forEach(function(b){if(S.badges.indexOf(b.id)===-1&&b.check(S))S.badges.push(b.id);});saveAll();showConfetti();render();setTimeout(function(){showMoodModal();},800);}

  return'<div style="padding:0 20px 20px;" class="fade-in"><div style="padding:28px 0 12px;"><div class="hd" style="font-size:clamp(20px,4.5vw,24px);font-weight:800;">Your Stats</div></div><div style="display:flex;gap:6px;margin-bottom:10px;"><div class="card-sm" style="flex:1;text-align:center;"><div class="hd" style="font-size:18px;color:var(--a1);">'+S.total+'</div><div style="font-size:8px;color:var(--text2);font-weight:600;">WORKOUTS</div></div><div class="card-sm" style="flex:1;text-align:center;"><div class="hd" style="font-size:18px;color:var(--a3);">'+S.xp+'</div><div style="font-size:8px;color:var(--text2);font-weight:600;">XP</div></div><div class="card-sm" style="flex:1;text-align:center;"><div class="hd" style="font-size:18px;color:var(--a2);">'+S.bstreak+'</div><div style="font-size:8px;color:var(--text2);font-weight:600;">BEST STREAK</div></div></div><div class="card" style="margin-bottom:10px;"><div class="hd" style="font-size:8px;color:var(--a1);letter-spacing:1px;margin-bottom:8px;">CALENDAR</div><div style="display:flex;flex-wrap:wrap;">'+cal+'</div></div>'+mH+'<div class="card"><div class="hd" style="font-size:8px;color:var(--a2);letter-spacing:1px;margin-bottom:6px;">WEIGHT LOG</div>'+wH+'</div></div>';
}
function renderBadges(){
  var lvl=getLevel(),next=getNextLevel(),prog=getLevelProg();
  var lc=levels.map(function(l){var u=S.xp>=l.minXP,ic=l.name===lvl.name;return'<div style="display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--card-r);'+(ic?'border:1px solid var(--a1);':'')+'"><div style="font-size:20px;'+(u?'':'filter:grayscale(100%);opacity:.25;')+'">'+l.icon+'</div><div style="flex:1;"><div style="font-size:12px;font-weight:700;color:'+(u?'var(--text)':'var(--text2)')+';">'+l.name+'</div><div class="hd" style="font-size:7px;color:var(--text2);">'+l.minXP+' XP</div></div>'+(ic?'<span class="tag" style="color:var(--a1);border-color:var(--a1);font-size:7px;">NOW</span>':'')+(u&&!ic?'<span style="color:var(--a4);">\u2713</span>':'')+'</div>';}).join('');
  var bc=badgesDef.map(function(b){var u=S.badges.indexOf(b.id)!==-1;return'<div class="card-sm" style="text-align:center;'+(u?'border-color:var(--a3);box-shadow:var(--glow1);':'opacity:.35;')+'"><div style="font-size:24px;margin-bottom:3px;'+(u?'':'filter:grayscale(100%);')+'">'+b.icon+'</div><div style="font-size:10px;font-weight:700;">'+b.name+'</div><div style="font-size:8px;color:var(--text2);margin-top:1px;">'+b.desc+'</div>'+(u?'<div class="hd" style="font-size:6px;color:var(--a3);margin-top:4px;">UNLOCKED</div>':'<div style="font-size:8px;color:var(--text2);margin-top:3px;">\uD83D\uDD12</div>')+'</div>';}).join('');
  return'<div style="padding:0 20px 20px;" class="fade-in"><div style="padding:28px 0 12px;"><div class="hd" style="font-size:clamp(20px,4.5vw,24px);font-weight:800;">Achievements</div></div><div class="card" style="margin-bottom:12px;border-color:var(--a1);"><div style="display:flex;align-items:center;gap:12px;margin-bottom:10px;"><div style="font-size:32px;">'+lvl.icon+'</div><div><div class="hd" style="font-size:7px;color:var(--a3);letter-spacing:1px;">CURRENT LEVEL</div><div style="font-size:18px;font-weight:700;margin-top:2px;">'+lvl.name+'</div></div></div><div class="xp-bar" style="height:10px;"><div style="width:'+prog+'%;"></div></div><div class="hd" style="font-size:7px;color:var(--text2);margin-top:4px;">'+S.xp+' XP'+(next?' \u2192 '+next.minXP+' for '+next.name:' MAX!')+'</div></div><div class="card" style="margin-bottom:12px;"><div class="hd" style="font-size:8px;color:var(--a2);letter-spacing:1px;margin-bottom:6px;">ROADMAP</div>'+lc+'</div><div class="hd" style="font-size:8px;color:var(--a1);letter-spacing:1px;margin-bottom:8px;">BADGES '+S.badges.length+'/'+badgesDef.length+'</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">'+bc+'</div></div>';
}
function renderPhotos(){
  var pg='';if(S.photos.length>0){pg=S.photos.map(function(p,i){return'<div style="position:relative;border:1px solid var(--border);border-radius:var(--card-r);overflow:hidden;"><img src="'+p.data+'" style="width:100%;display:block;aspect-ratio:1;object-fit:cover;" /><div style="position:absolute;bottom:0;left:0;right:0;padding:6px;background:linear-gradient(transparent,rgba(0,0,0,0.6));"><div class="hd" style="font-size:7px;color:var(--a1);">'+p.date+'</div></div><button onclick="deletePhoto('+i+')" style="position:absolute;top:6px;right:6px;width:22px;height:22px;background:rgba(0,0,0,0.6);border:1px solid var(--a1);border-radius:50%;color:var(--a1);font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;">\u2715</button></div>';}).join('');}else{pg='<div style="grid-column:1/-1;text-align:center;padding:30px;"><div style="font-size:36px;margin-bottom:8px;">\uD83D\uDCF8</div><div style="font-size:13px;font-weight:700;">No photos yet</div><div style="font-size:11px;color:var(--text2);margin-top:2px;">Take your first progress photo!</div></div>';}
  var cmp='';if(S.photos.length>=2){var f=S.photos[0],l=S.photos[S.photos.length-1];cmp='<div class="card" style="margin-bottom:10px;"><div class="hd" style="font-size:8px;color:var(--a1);letter-spacing:1px;margin-bottom:8px;">FIRST vs LATEST</div><div style="display:flex;gap:6px;"><div style="flex:1;text-align:center;"><img src="'+f.data+'" style="width:100%;border:1px solid var(--border);border-radius:var(--card-r);aspect-ratio:1;object-fit:cover;" /><div class="hd" style="font-size:7px;color:var(--text2);margin-top:3px;">'+f.date+'</div></div><div style="flex:1;text-align:center;"><img src="'+l.data+'" style="width:100%;border:1px solid var(--border);border-radius:var(--card-r);aspect-ratio:1;object-fit:cover;" /><div class="hd" style="font-size:7px;color:var(--text2);margin-top:3px;">'+l.date+'</div></div></div></div>';}
  return'<div style="padding:0 20px 20px;" class="fade-in"><div style="padding:28px 0 12px;"><div class="hd" style="font-size:clamp(20px,4.5vw,24px);font-weight:800;">Progress Photos</div></div><div style="margin-bottom:12px;"><label class="btn btn-fill" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;font-size:11px;cursor:pointer;"><input type="file" accept="image/*" capture="environment" onchange="handlePhoto(this)" style="display:none;" />\uD83D\uDCF7 ADD PHOTO</label></div>'+cmp+'<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;">'+pg+'</div></div>';
}
function renderSettings(){
  var themeOpts=[['terminal','Terminal','\uD83D\uDDA5\uFE0F'],['hacker','Hacker','\uD83D\uDC7E'],['y2k','Y2K / Retro Future','\u2728'],['glass','Glassmorphism','\uD83E\uDDCA'],['cyber','Cyberpunk','\uD83E\uDD16'],['brutalism','Neobrutalism','\uD83D\uDFE5'],['kawaii','Kawaii','\uD83C\uDF38'],['vaporwave','Vaporwave','\uD83C\uDF03'],['sunset','Sunset','\uD83C\uDF05'],['minimal','Minimalist Japanese','\uD83C\uDFB4'],['memphis','Memphis Design','\uD83D\uDD36']];
  var thBtns=themeOpts.map(function(t){return'<button onclick="setTheme(\''+t[0]+'\')" class="card-sm" style="text-align:center;cursor:pointer;'+(S.theme===t[0]?'border-color:var(--a1);box-shadow:var(--glow1);':'')+'"><div style="font-size:22px;">'+t[2]+'</div><div style="font-size:12px;font-weight:700;margin-top:3px;">'+t[1]+'</div>'+(S.theme===t[0]?'<div class="hd" style="font-size:8px;color:var(--a1);margin-top:2px;">ACTIVE</div>':'')+'</button>';}).join('');
  var phBtns=phases.map(function(p,i){var cur=(S.phase||0)===i,unlocked=i<=((S.phase||0)+1);return'<div class="card-sm" style="'+(cur?'border-color:var(--a1);box-shadow:var(--glow1);':'')+(unlocked?'':'opacity:.35;')+'"><div style="display:flex;justify-content:space-between;align-items:center;"><div><div style="font-size:13px;font-weight:700;">Phase '+(i+1)+': '+p.name+'</div><div style="font-size:10px;color:var(--text2);">Weeks '+p.weeks+' \u2014 '+p.desc+'</div></div>'+(cur?'<span class="tag" style="color:var(--a1);border-color:var(--a1);font-size:7px;">NOW</span>':'')+'</div>'+(unlocked&&!cur&&i===(S.phase||0)+1?'<button onclick="advancePhase()" class="btn btn-fill" style="width:100%;margin-top:8px;font-size:9px;padding:8px;">ADVANCE TO THIS PHASE</button>':'')+'</div>';}).join('');
  var sl=S.sessionLength||60;
  var sessionBtns='<div style="display:flex;gap:8px;"><button onclick="setSessionLength(60)" class="btn'+(sl===60?' btn-fill':'')+'" style="flex:1;padding:12px;font-size:12px;">60 MIN</button><button onclick="setSessionLength(90)" class="btn'+(sl===90?' btn-fill':'')+'" style="flex:1;padding:12px;font-size:12px;">90 MIN</button></div>';
  return'<div style="padding:0 20px 20px;" class="fade-in"><div style="padding:28px 0 12px;display:flex;justify-content:space-between;"><div class="hd" style="font-size:clamp(18px,4.5vw,22px);font-weight:800;">Settings</div><button onclick="goTo(\'home\')" class="btn" style="font-size:11px;padding:8px 16px;">\u2190 back</button></div><div class="hd" style="font-size:10px;color:var(--a2);letter-spacing:1px;margin-bottom:8px;">THEME</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px;">'+thBtns+'</div><div class="hd" style="font-size:10px;color:var(--a3);letter-spacing:1px;margin-bottom:8px;">SESSION LENGTH</div><div class="card-sm" style="margin-bottom:18px;"><div style="font-size:13px;font-weight:700;margin-bottom:4px;">Workout Session Duration</div><div style="font-size:11px;color:var(--text2);margin-bottom:4px;">60 min = 4 exercises per workout (focused)</div><div style="font-size:11px;color:var(--text2);margin-bottom:10px;">90 min = all exercises per workout (full)</div>'+sessionBtns+'</div><div class="hd" style="font-size:10px;color:var(--a1);letter-spacing:1px;margin-bottom:8px;">TRAINING PHASE</div><div style="display:flex;flex-direction:column;gap:6px;margin-bottom:18px;">'+phBtns+'</div><div class="hd" style="font-size:10px;color:var(--a3);letter-spacing:1px;margin-bottom:8px;">MEAL ROTATION</div><div class="card-sm" style="margin-bottom:18px;"><div style="font-size:13px;font-weight:700;">Week '+((S.mealWeek||0)+1)+' of '+mealWeeks.length+'</div><div style="font-size:11px;color:var(--text2);margin-top:2px;">Meals rotate automatically each week reset. 4 weeks of variety!</div></div><div class="hd" style="font-size:10px;color:var(--a5);letter-spacing:1px;margin-bottom:8px;">DANGER ZONE</div><div class="card-sm"><button onclick="if(confirm(\'Reset ALL data? This cannot be undone.\')){localStorage.removeItem(\'fitquest\');S=JSON.parse(JSON.stringify(DF));setActiveData();render();}" class="btn" style="width:100%;border-color:#ff4444;color:#ff4444;font-size:11px;padding:12px;">RESET ALL DATA</button></div></div>';
}
function render(){
  document.body.setAttribute('data-theme',S.theme||'terminal');
  if(!S.dark)document.body.classList.add('light');else document.body.classList.remove('light');
  if(S.dark)document.body.classList.add('dark-mode');else document.body.classList.remove('dark-mode');
  var c='';switch(CV){case'home':c=renderHome();break;case'workout':c=renderWorkout();break;case'meals':c=renderMeals();break;case'recipe':c=renderRecipe();break;case'prep':c=renderPrep();break;case'grocery':c=renderGrocery();break;case'stats':c=renderStats();break;case'badges':c=renderBadges();break;case'photos':c=renderPhotos();break;case'settings':c=renderSettings();break;}
  var hasNav=CV!=='workout'&&CV!=='recipe'&&CV!=='grocery'&&CV!=='prep'&&CV!=='settings';
  document.getElementById('app').innerHTML=c+(hasNav?renderNav():'');
  var mr=document.getElementById('modal-root');if(MC){mr.innerHTML='<div class="modal-overlay" onclick="if(event.target===this)closeModal()"><div class="modal">'+MC+'</div></div>';}else{mr.innerHTML='';}
}
render();
</script></body></html>
